<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mapa de la Isla del Silencio — El Drac de les Cançons</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  html, body { margin: 0; padding: 0; }
  svg { display: block; width: 210mm; height: 297mm; }
</style>
</head>
<body>
<!--
  El póster de pared con los ocho sitios de la campaña entera.

  La versión anterior de esta hoja era un mapa dibujado a mano en SVG con los
  cuatro lugares del episodio 1 y tres círculos de «?» por descubrir. Se quedó
  corta en cuanto existieron los cinco episodios, así que aquí el mapa es ya la
  ilustración de ../imagenes/mapa-isla.jpg, que es la misma que cuelga de la
  pared, y lo que añade esta hoja encima son los ocho sitios numerados por
  episodio y la leyenda de colores.

  Los números son de EPISODIO, no de orden: por eso hay tres «1». Es a
  propósito, para que coincida con lo que ven en el iPad (MapaIsla.tsx usa los
  mismos colores por episodio). El orden del viaje ya lo cuenta el camino de
  puntos rojos de la propia ilustración.

  El SVG que se dibujaba a mano no se ha tirado: sigue vivo en la web, en
  src/componentes/arte/MapaIsla.tsx. Si mueves un sitio de allí, muévelo
  también aquí.

  Para regenerar el PDF hace falta --allow-file-access-from-files, o Chrome no
  carga la ilustración y sale la hoja en blanco:
  chrome --headless --disable-gpu --no-pdf-header-footer --allow-file-access-from-files --print-to-pdf=salida.pdf 3-mapa-isla.html
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 2970" width="210mm" height="297mm">

  <!-- ===== FONDO ===== -->
  <rect x="0" y="0" width="2100" height="2970" fill="#FBF3E2"/>
  <rect x="42" y="42" width="2016" height="2886" rx="46" fill="none" stroke="#5C4426" stroke-width="14"/>

  <!-- ===== TÍTULO ===== -->
  <text x="1050" y="176" font-family="Georgia, serif" font-size="106" font-weight="bold"
        fill="#5C4426" text-anchor="middle" letter-spacing="4">LA ISLA DEL SILENCIO</text>
  <text x="1050" y="250" font-family="Georgia, serif" font-size="50" font-style="italic"
        fill="#8A6A3C" text-anchor="middle">Aquí duermen las cinco canciones</text>

  <!-- ===== EL MAPA ===== -->
  <!-- 1490 × 2235 mantiene la proporción exacta del original de 1600 × 2400 -->
  <image href="../imagenes/mapa-isla.jpg" x="305" y="290" width="1490" height="2235"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- ===== LOS OCHO SITIOS ===== -->

  <!-- LA PLAYA · episodio 1 -->
  <g>
    <circle cx="976" cy="2145" r="42" fill="#FFFFFF" stroke="#C1272D" stroke-width="8"/>
    <text x="976" y="2164" font-family="Georgia, serif" font-size="52" font-weight="bold"
          fill="#C1272D" text-anchor="middle">1</text>
    <rect x="881" y="2197" width="190" height="54" rx="14" fill="#FAF0D4" fill-opacity="0.95"
          stroke="#C1272D" stroke-width="4"/>
    <text x="976" y="2236" font-family="Georgia, serif" font-size="36" font-weight="bold"
          fill="#5C4426" text-anchor="middle" textLength="150" lengthAdjust="spacingAndGlyphs">La playa</text>
  </g>

  <!-- EL PUENTE · episodio 1 -->
  <g>
    <circle cx="1243" cy="1852" r="42" fill="#FFFFFF" stroke="#C1272D" stroke-width="8"/>
    <text x="1243" y="1871" font-family="Georgia, serif" font-size="52" font-weight="bold"
          fill="#C1272D" text-anchor="middle">1</text>
    <rect x="1140" y="1904" width="206" height="54" rx="14" fill="#FAF0D4" fill-opacity="0.95"
          stroke="#C1272D" stroke-width="4"/>
    <text x="1243" y="1943" font-family="Georgia, serif" font-size="36" font-weight="bold"
          fill="#5C4426" text-anchor="middle" textLength="166" lengthAdjust="spacingAndGlyphs">El puente</text>
  </g>

  <!-- LA CUEVA · episodio 1 -->
  <g>
    <circle cx="1631" cy="1597" r="42" fill="#FFFFFF" stroke="#C1272D" stroke-width="8"/>
    <text x="1631" y="1616" font-family="Georgia, serif" font-size="52" font-weight="bold"
          fill="#C1272D" text-anchor="middle">1</text>
    <rect x="1536" y="1649" width="190" height="54" rx="14" fill="#FAF0D4" fill-opacity="0.95"
          stroke="#C1272D" stroke-width="4"/>
    <text x="1631" y="1688" font-family="Georgia, serif" font-size="36" font-weight="bold"
          fill="#5C4426" text-anchor="middle" textLength="150" lengthAdjust="spacingAndGlyphs">La cueva</text>
  </g>

  <!-- EL BOSQUE · episodio 2 -->
  <g>
    <circle cx="1311" cy="1240" r="42" fill="#FFFFFF" stroke="#2E7D8C" stroke-width="8"/>
    <text x="1311" y="1259" font-family="Georgia, serif" font-size="52" font-weight="bold"
          fill="#2E7D8C" text-anchor="middle">2</text>
    <rect x="1206" y="1292" width="210" height="54" rx="14" fill="#FAF0D4" fill-opacity="0.95"
          stroke="#2E7D8C" stroke-width="4"/>
    <text x="1311" y="1331" font-family="Georgia, serif" font-size="36" font-weight="bold"
          fill="#5C4426" text-anchor="middle" textLength="170" lengthAdjust="spacingAndGlyphs">El bosque</text>
  </g>

  <!-- EL MOLINO · episodio 2 -->
  <g>
    <circle cx="1345" cy="771" r="42" fill="#FFFFFF" stroke="#2E7D8C" stroke-width="8"/>
    <text x="1345" y="790" font-family="Georgia, serif" font-size="52" font-weight="bold"
          fill="#2E7D8C" text-anchor="middle">2</text>
    <rect x="1240" y="823" width="210" height="54" rx="14" fill="#FAF0D4" fill-opacity="0.95"
          stroke="#2E7D8C" stroke-width="4"/>
    <text x="1345" y="862" font-family="Georgia, serif" font-size="36" font-weight="bold"
          fill="#5C4426" text-anchor="middle" textLength="170" lengthAdjust="spacingAndGlyphs">El molino</text>
  </g>

  <!-- EL ÁRBOL · episodio 3 -->
  <g>
    <circle cx="742" cy="1061" r="42" fill="#FFFFFF" stroke="#4A8C46" stroke-width="8"/>
    <text x="742" y="1080" font-family="Georgia, serif" font-size="52" font-weight="bold"
          fill="#4A8C46" text-anchor="middle">3</text>
    <rect x="650" y="1113" width="184" height="54" rx="14" fill="#FAF0D4" fill-opacity="0.95"
          stroke="#4A8C46" stroke-width="4"/>
    <text x="742" y="1152" font-family="Georgia, serif" font-size="36" font-weight="bold"
          fill="#5C4426" text-anchor="middle" textLength="144" lengthAdjust="spacingAndGlyphs">El árbol</text>
  </g>

  <!-- LA CALA · episodio 4 -->
  <g>
    <circle cx="680" cy="1690" r="42" fill="#FFFFFF" stroke="#C9A227" stroke-width="8"/>
    <text x="680" y="1709" font-family="Georgia, serif" font-size="52" font-weight="bold"
          fill="#C9A227" text-anchor="middle">4</text>
    <rect x="595" y="1742" width="170" height="54" rx="14" fill="#FAF0D4" fill-opacity="0.95"
          stroke="#C9A227" stroke-width="4"/>
    <text x="680" y="1781" font-family="Georgia, serif" font-size="36" font-weight="bold"
          fill="#5C4426" text-anchor="middle" textLength="130" lengthAdjust="spacingAndGlyphs">La cala</text>
  </g>

  <!-- LA MONTAÑA · episodio 5 -->
  <g>
    <circle cx="908" cy="1463" r="42" fill="#FFFFFF" stroke="#8A2820" stroke-width="8"/>
    <text x="908" y="1482" font-family="Georgia, serif" font-size="52" font-weight="bold"
          fill="#8A2820" text-anchor="middle">5</text>
    <rect x="796" y="1515" width="224" height="54" rx="14" fill="#FAF0D4" fill-opacity="0.95"
          stroke="#8A2820" stroke-width="4"/>
    <text x="908" y="1554" font-family="Georgia, serif" font-size="36" font-weight="bold"
          fill="#5C4426" text-anchor="middle" textLength="184" lengthAdjust="spacingAndGlyphs">La montaña</text>
  </g>

  <!-- ===== LEYENDA: QUÉ COLOR ES CADA EPISODIO ===== -->
  <line x1="305" y1="2570" x2="1795" y2="2570" stroke="#C9A227" stroke-width="6"/>

  <!-- episodio 1 -->
  <g>
    <circle cx="454" cy="2668" r="40" fill="#FFFFFF" stroke="#C1272D" stroke-width="8"/>
    <text x="454" y="2686" font-family="Georgia, serif" font-size="50" font-weight="bold"
          fill="#C1272D" text-anchor="middle">1</text>
    <g font-family="Trebuchet MS, sans-serif" font-size="32" fill="#7A6248" text-anchor="middle">
      <text x="454" y="2768" font-weight="bold" fill="#5C4426" font-size="34">EPISODIO 1</text>
      <text x="454" y="2814">La playa</text>
      <text x="454" y="2856">El puente</text>
      <text x="454" y="2898">La cueva</text>
    </g>
  </g>

  <!-- episodio 2 -->
  <g>
    <circle cx="752" cy="2668" r="40" fill="#FFFFFF" stroke="#2E7D8C" stroke-width="8"/>
    <text x="752" y="2686" font-family="Georgia, serif" font-size="50" font-weight="bold"
          fill="#2E7D8C" text-anchor="middle">2</text>
    <g font-family="Trebuchet MS, sans-serif" font-size="32" fill="#7A6248" text-anchor="middle">
      <text x="752" y="2768" font-weight="bold" fill="#5C4426" font-size="34">EPISODIO 2</text>
      <text x="752" y="2814">El bosque</text>
      <text x="752" y="2856">El molino</text>
    </g>
  </g>

  <!-- episodio 3 -->
  <g>
    <circle cx="1050" cy="2668" r="40" fill="#FFFFFF" stroke="#4A8C46" stroke-width="8"/>
    <text x="1050" y="2686" font-family="Georgia, serif" font-size="50" font-weight="bold"
          fill="#4A8C46" text-anchor="middle">3</text>
    <g font-family="Trebuchet MS, sans-serif" font-size="32" fill="#7A6248" text-anchor="middle">
      <text x="1050" y="2768" font-weight="bold" fill="#5C4426" font-size="34">EPISODIO 3</text>
      <text x="1050" y="2814">El árbol</text>
    </g>
  </g>

  <!-- episodio 4 -->
  <g>
    <circle cx="1348" cy="2668" r="40" fill="#FFFFFF" stroke="#C9A227" stroke-width="8"/>
    <text x="1348" y="2686" font-family="Georgia, serif" font-size="50" font-weight="bold"
          fill="#C9A227" text-anchor="middle">4</text>
    <g font-family="Trebuchet MS, sans-serif" font-size="32" fill="#7A6248" text-anchor="middle">
      <text x="1348" y="2768" font-weight="bold" fill="#5C4426" font-size="34">EPISODIO 4</text>
      <text x="1348" y="2814">La cala</text>
    </g>
  </g>

  <!-- episodio 5 -->
  <g>
    <circle cx="1646" cy="2668" r="40" fill="#FFFFFF" stroke="#8A2820" stroke-width="8"/>
    <text x="1646" y="2686" font-family="Georgia, serif" font-size="50" font-weight="bold"
          fill="#8A2820" text-anchor="middle">5</text>
    <g font-family="Trebuchet MS, sans-serif" font-size="32" fill="#7A6248" text-anchor="middle">
      <text x="1646" y="2768" font-weight="bold" fill="#5C4426" font-size="34">EPISODIO 5</text>
      <text x="1646" y="2814">La montaña</text>
    </g>
  </g>

</svg>
</body>
</html>
