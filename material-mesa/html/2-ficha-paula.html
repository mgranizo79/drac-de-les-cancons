<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Paula — Cazadragones de la Luna</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  html, body { margin: 0; padding: 0; }
  svg { display: block; width: 210mm; height: 297mm; }
</style>
</head>
<body>
<!--
  Necesita --allow-file-access-from-files para que Chrome cargue el retrato:
  chrome --headless --disable-gpu --no-pdf-header-footer --allow-file-access-from-files --print-to-pdf=salida.pdf 2-ficha-paula.html
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 2970" width="210mm" height="297mm">

  <!-- ===== FONDO Y MARCO ===== -->
  <rect x="0" y="0" width="2100" height="2970" fill="#FBF3E2"/>
  <rect x="42" y="42" width="2016" height="2886" rx="52" fill="none" stroke="#2C3E6B" stroke-width="20"/>
  <rect x="80" y="80" width="1940" height="2810" rx="34" fill="none" stroke="#C9A227" stroke-width="8"/>

  <!-- ===== TÍTULO ===== -->
  <text x="1050" y="322" font-family="Georgia, serif" font-size="212" font-weight="bold"
        fill="#2C3E6B" text-anchor="middle" letter-spacing="8">PAULA</text>
  <text x="1050" y="424" font-family="Trebuchet MS, sans-serif" font-size="76" font-weight="bold"
        fill="#7B5EA7" text-anchor="middle" letter-spacing="8">CAZADRAGONES DE LA LUNA</text>

  <!-- lunas decorativas -->
  <g fill="#C9A227">
    <path d="M268,232 a58,58 0 1,0 0,116 a44,44 0 1,1 0,-116 Z"/>
    <path d="M1832,232 a58,58 0 1,0 0,116 a44,44 0 1,1 0,-116 Z"/>
  </g>

  <!-- ===== RETRATO ===== -->
  <rect x="120" y="480" width="560" height="760" rx="40" fill="#F3F1FA" stroke="#7B5EA7" stroke-width="8"/>
  <image href="../imagenes/tarjetas/paula.png" x="145" y="502" width="510" height="716"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- ═══════════ PODERES ═══════════ -->

  <!-- EL RAYO DE LUNA -->
  <rect x="720" y="480" width="1260" height="240" rx="30" fill="#F6F1FB" stroke="#7B5EA7" stroke-width="8"/>
  <text x="768" y="560" font-family="Trebuchet MS, sans-serif" font-size="62" font-weight="bold" fill="#7B5EA7">EL RAYO DE LUNA</text>
  <text x="768" y="622" font-family="Trebuchet MS, sans-serif" font-size="42" fill="#5C4A7A">Golpeo el diapasón de plata y lanzo la nota</text>
  <text x="768" y="674" font-family="Trebuchet MS, sans-serif" font-size="42" fill="#5C4A7A">hecha luz con las manos. <tspan font-weight="bold" fill="#4A8C46">Con 4+ acierta.</tspan></text>
  <g transform="translate(1860,600)">
    <path d="M0,-72 l20,50 52,4 -40,34 13,52 -45,-29 -45,29 13,-52 -40,-34 52,-4 Z" fill="#C9A227" stroke="#8A6520" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- EL GRITO DE PLATA -->
  <rect x="720" y="735" width="1260" height="280" rx="30" fill="#EEF2FA" stroke="#2C3E6B" stroke-width="8"/>
  <text x="768" y="815" font-family="Trebuchet MS, sans-serif" font-size="62" font-weight="bold" fill="#2C3E6B">EL GRITO DE PLATA</text>
  <text x="768" y="877" font-family="Trebuchet MS, sans-serif" font-size="42" fill="#4A5A7A">Canto una nota y la criatura huye. Sin dado.</text>
  <text x="768" y="952" font-family="Trebuchet MS, sans-serif" font-size="42" font-weight="bold" fill="#2C3E6B">1 vez por episodio:</text>
  <g>
    <rect x="1290" y="900" width="66" height="66" rx="13" fill="#FFFFFF" stroke="#2C3E6B" stroke-width="6"/>
    <text x="1323" y="948" font-family="Trebuchet MS, sans-serif" font-size="40" fill="#8E9BB0" text-anchor="middle">1</text>
    <rect x="1376" y="900" width="66" height="66" rx="13" fill="#FFFFFF" stroke="#2C3E6B" stroke-width="6"/>
    <text x="1409" y="948" font-family="Trebuchet MS, sans-serif" font-size="40" fill="#8E9BB0" text-anchor="middle">2</text>
    <rect x="1462" y="900" width="66" height="66" rx="13" fill="#FFFFFF" stroke="#2C3E6B" stroke-width="6"/>
    <text x="1495" y="948" font-family="Trebuchet MS, sans-serif" font-size="40" fill="#8E9BB0" text-anchor="middle">3</text>
    <rect x="1548" y="900" width="66" height="66" rx="13" fill="#FFFFFF" stroke="#2C3E6B" stroke-width="6"/>
    <text x="1581" y="948" font-family="Trebuchet MS, sans-serif" font-size="40" fill="#8E9BB0" text-anchor="middle">4</text>
    <rect x="1634" y="900" width="66" height="66" rx="13" fill="#FFFFFF" stroke="#2C3E6B" stroke-width="6"/>
    <text x="1667" y="948" font-family="Trebuchet MS, sans-serif" font-size="40" fill="#8E9BB0" text-anchor="middle">5</text>
  </g>
  <g fill="#C9D4E5" transform="translate(1810,900) scale(1.1)">
    <ellipse cx="0" cy="0" rx="18" ry="14" transform="rotate(-22)"/>
    <rect x="12" y="-66" width="8" height="66"/>
    <path d="M20,-66 C42,-55 46,-34 34,-18 C42,-38 34,-50 20,-55 Z"/>
  </g>

  <!-- OJO DE EXPERTA -->
  <rect x="720" y="1030" width="1260" height="210" rx="30" fill="#FBF1E4" stroke="#C9A227" stroke-width="8"/>
  <text x="768" y="1105" font-family="Trebuchet MS, sans-serif" font-size="58" font-weight="bold" fill="#A8791A">OJO DE EXPERTA</text>
  <text x="768" y="1163" font-family="Trebuchet MS, sans-serif" font-size="42" fill="#6B5A38">Si acierto qué dragón es, el grupo gana</text>
  <text x="768" y="1219" font-family="Trebuchet MS, sans-serif" font-size="52" font-weight="bold" fill="#C1272D">UN DADO EXTRA</text>
  <g transform="translate(1850,1135)">
    <rect x="-58" y="-58" width="116" height="116" rx="20" fill="#FFFFFF" stroke="#C9A227" stroke-width="7"/>
    <circle cx="-28" cy="-28" r="12" fill="#C9A227"/>
    <circle cx="28" cy="-28" r="12" fill="#C9A227"/>
    <circle cx="0" cy="0" r="12" fill="#C9A227"/>
    <circle cx="-28" cy="28" r="12" fill="#C9A227"/>
    <circle cx="28" cy="28" r="12" fill="#C9A227"/>
  </g>

  <!-- ===== CUADERNO DE PISTAS ===== -->
  <rect x="120" y="1290" width="1860" height="960" rx="40" fill="#FFFFFF" stroke="#2C3E6B" stroke-width="10"/>
  <rect x="120" y="1290" width="1860" height="130" rx="40" fill="#2C3E6B"/>
  <rect x="120" y="1380" width="1860" height="40" fill="#2C3E6B"/>
  <text x="1050" y="1382" font-family="Trebuchet MS, sans-serif" font-size="80" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="4">MIS PISTAS SOBRE EL DRAGÓN</text>

  <g>
    <circle cx="248" cy="1520" r="52" fill="#C1272D"/>
    <text x="248" y="1543" font-family="Trebuchet MS, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <line x1="336" y1="1562" x2="1900" y2="1562" stroke="#B9C4D6" stroke-width="5" stroke-dasharray="14 12"/>

    <circle cx="248" cy="1670" r="52" fill="#7B5EA7"/>
    <text x="248" y="1693" font-family="Trebuchet MS, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <line x1="336" y1="1712" x2="1900" y2="1712" stroke="#B9C4D6" stroke-width="5" stroke-dasharray="14 12"/>

    <circle cx="248" cy="1820" r="52" fill="#2E7D8C"/>
    <text x="248" y="1843" font-family="Trebuchet MS, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <line x1="336" y1="1862" x2="1900" y2="1862" stroke="#B9C4D6" stroke-width="5" stroke-dasharray="14 12"/>

    <circle cx="248" cy="1970" r="52" fill="#4A8C46"/>
    <text x="248" y="1993" font-family="Trebuchet MS, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <line x1="336" y1="2012" x2="1900" y2="2012" stroke="#B9C4D6" stroke-width="5" stroke-dasharray="14 12"/>

    <circle cx="248" cy="2120" r="52" fill="#C9A227"/>
    <text x="248" y="2143" font-family="Trebuchet MS, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
    <line x1="336" y1="2162" x2="1900" y2="2162" stroke="#B9C4D6" stroke-width="5" stroke-dasharray="14 12"/>
  </g>
  <text x="336" y="1478" font-family="Trebuchet MS, sans-serif" font-size="44" fill="#8E9BB0" font-style="italic">Una pista por episodio. Apúntalas todas.</text>

  <!-- ===== MI APUESTA ===== -->
  <rect x="120" y="2290" width="1860" height="380" rx="40" fill="#FDECEC" stroke="#C1272D" stroke-width="10"/>
  <text x="200" y="2400" font-family="Trebuchet MS, sans-serif" font-size="74" font-weight="bold" fill="#C1272D">MI APUESTA: ¿QUÉ DRAGÓN ES?</text>
  <line x1="200" y1="2520" x2="1900" y2="2520" stroke="#E09A9A" stroke-width="5"/>
  <line x1="200" y1="2630" x2="1900" y2="2630" stroke="#E09A9A" stroke-width="5"/>
  <text x="1900" y="2450" font-family="Trebuchet MS, sans-serif" font-size="42" fill="#B07070"
        text-anchor="end" font-style="italic">Puedo cambiar de idea cada episodio</text>

  <!-- ===== PIE: DADO + CANCIONES ===== -->
  <rect x="120" y="2710" width="900" height="180" rx="30" fill="#FFFFFF" stroke="#4A8C46" stroke-width="8"/>
  <g transform="translate(228,2800)">
    <rect x="-62" y="-62" width="124" height="124" rx="22" fill="#4A8C46"/>
    <circle cx="-30" cy="-30" r="12" fill="#FFFFFF"/>
    <circle cx="30" cy="-30" r="12" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="12" fill="#FFFFFF"/>
    <circle cx="-30" cy="30" r="12" fill="#FFFFFF"/>
    <circle cx="30" cy="30" r="12" fill="#FFFFFF"/>
  </g>
  <text x="330" y="2782" font-family="Trebuchet MS, sans-serif" font-size="56" font-weight="bold" fill="#4A8C46">4, 5 o 6 = SALE BIEN</text>
  <text x="330" y="2848" font-family="Trebuchet MS, sans-serif" font-size="42" fill="#6B7A68">Ayudándonos, tiramos 2 dados</text>

  <rect x="1080" y="2710" width="900" height="180" rx="30" fill="#FFFFFF" stroke="#2E7D8C" stroke-width="8"/>
  <text x="1530" y="2778" font-family="Trebuchet MS, sans-serif" font-size="50" font-weight="bold"
        fill="#2E7D8C" text-anchor="middle">CANCIONES RESCATADAS</text>
  <g>
    <circle cx="1250" cy="2838" r="34" fill="none" stroke="#2E7D8C" stroke-width="6"/>
    <circle cx="1390" cy="2838" r="34" fill="none" stroke="#2E7D8C" stroke-width="6"/>
    <circle cx="1530" cy="2838" r="34" fill="none" stroke="#2E7D8C" stroke-width="6"/>
    <circle cx="1670" cy="2838" r="34" fill="none" stroke="#2E7D8C" stroke-width="6"/>
    <circle cx="1810" cy="2838" r="34" fill="none" stroke="#2E7D8C" stroke-width="6"/>
  </g>

</svg>
</body>
</html>
