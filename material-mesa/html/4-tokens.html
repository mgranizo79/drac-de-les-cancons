<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Figuras para la mesa — El Drac de les Cançons</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  html, body { margin: 0; padding: 0; }
  svg { display: block; width: 210mm; height: 297mm; }
</style>
</head>
<body>
<!--
  Formato tarjeta + peana con ranura.

  El formato anterior (standee plegado, la figura repetida en espejo) funcionaba
  con los dibujos SVG porque tenían silueta. Con estos PNG no: llevan fondo
  blanco, así que en espejo se vería un rectángulo blanco en vez de la figura.
  La tarjeta enmarca el fondo blanco en lugar de pelearse con él.

  Las imágenes son las mismas de public/imagenes/, reescaladas a 750 px de ancho
  y en JPEG (ver material-mesa/imagenes/tarjetas/). A 300 DPI una tarjeta de
  52 mm necesita ~614 px, así que sobra resolución; con los PNG originales el
  PDF pesaba 7,4 MB y así se queda en menos de 1 MB.

  Para regenerar el PDF hace falta --allow-file-access-from-files, o Chrome no
  carga las imágenes locales:
  chrome --headless --disable-gpu --no-pdf-header-footer --allow-file-access-from-files --print-to-pdf=salida.pdf 4-tokens.html
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 2970" width="210mm" height="297mm">

  <defs>
    <clipPath id="im1"><rect x="150" y="490" width="520" height="700" rx="18"/></clipPath>
    <clipPath id="im2"><rect x="790" y="490" width="520" height="700" rx="18"/></clipPath>
    <clipPath id="im3"><rect x="1430" y="490" width="520" height="700" rx="18"/></clipPath>
    <clipPath id="im4"><rect x="470" y="1590" width="520" height="700" rx="18"/></clipPath>
    <clipPath id="im5"><rect x="1110" y="1590" width="520" height="700" rx="18"/></clipPath>
  </defs>

  <!-- ===== FONDO ===== -->
  <rect x="0" y="0" width="2100" height="2970" fill="#FBF3E2"/>
  <rect x="42" y="42" width="2016" height="2886" rx="46" fill="none" stroke="#5C4426" stroke-width="14"/>

  <!-- ===== TÍTULO E INSTRUCCIONES ===== -->
  <text x="1050" y="196" font-family="Georgia, serif" font-size="106" font-weight="bold"
        fill="#5C4426" text-anchor="middle" letter-spacing="4">FIGURAS PARA LA MESA</text>

  <g font-family="Trebuchet MS, sans-serif" font-size="44" fill="#7A6248">
    <text x="1050" y="286" text-anchor="middle">
      <tspan font-weight="bold" fill="#C1272D">1.</tspan> Recorta las tarjetas y las peanas.
      <tspan font-weight="bold" fill="#C1272D">2.</tspan> Haz un corte en la raya roja de la peana.
    </text>
    <text x="1050" y="348" text-anchor="middle">
      <tspan font-weight="bold" fill="#C1272D">3.</tspan> Mete la pestaña de la tarjeta en el corte: ya se tiene de pie.
    </text>
  </g>
  <line x1="420" y1="400" x2="1680" y2="400" stroke="#C9A227" stroke-width="6"/>

  <!-- ═══════════ FILA 1 ═══════════ -->

  <!-- PAULA -->
  <g>
    <path d="M120,470 Q120,440 150,440 L670,440 Q700,440 700,470 L700,1320 L525,1320 L525,1450 L295,1450 L295,1320 L120,1320 Z"
          fill="#FFFFFF" stroke="#7B5EA7" stroke-width="10" stroke-linejoin="round"/>
    <g clip-path="url(#im1)"><image href="../imagenes/tarjetas/paula.jpg" x="150" y="490" width="520" height="700" preserveAspectRatio="xMidYMid slice"/></g>
    <rect x="150" y="490" width="520" height="700" rx="18" fill="none" stroke="#D8CCE8" stroke-width="5"/>
    <text x="410" y="1272" font-family="Trebuchet MS, sans-serif" font-size="62" font-weight="bold"
          fill="#7B5EA7" text-anchor="middle">PAULA</text>
    <line x1="295" y1="1320" x2="525" y2="1320" stroke="#C9B8DE" stroke-width="4" stroke-dasharray="10 10"/>
  </g>

  <!-- SIR LUCA -->
  <g>
    <path d="M760,470 Q760,440 790,440 L1310,440 Q1340,440 1340,470 L1340,1320 L1165,1320 L1165,1450 L935,1450 L935,1320 L760,1320 Z"
          fill="#FFFFFF" stroke="#C1272D" stroke-width="10" stroke-linejoin="round"/>
    <g clip-path="url(#im2)"><image href="../imagenes/tarjetas/luca.jpg" x="790" y="490" width="520" height="700" preserveAspectRatio="xMidYMid slice"/></g>
    <rect x="790" y="490" width="520" height="700" rx="18" fill="none" stroke="#EFCFD0" stroke-width="5"/>
    <text x="1050" y="1272" font-family="Trebuchet MS, sans-serif" font-size="62" font-weight="bold"
          fill="#C1272D" text-anchor="middle">SIR LUCA</text>
    <line x1="935" y1="1320" x2="1165" y2="1320" stroke="#EDC4C5" stroke-width="4" stroke-dasharray="10 10"/>
  </g>

  <!-- CAPITÁN MIGAS -->
  <g>
    <path d="M1400,470 Q1400,440 1430,440 L1950,440 Q1980,440 1980,470 L1980,1320 L1805,1320 L1805,1450 L1575,1450 L1575,1320 L1400,1320 Z"
          fill="#FFFFFF" stroke="#2E7D8C" stroke-width="10" stroke-linejoin="round"/>
    <g clip-path="url(#im3)"><image href="../imagenes/tarjetas/migas.jpg" x="1430" y="490" width="520" height="700" preserveAspectRatio="xMidYMid slice"/></g>
    <rect x="1430" y="490" width="520" height="700" rx="18" fill="none" stroke="#C4DCE2" stroke-width="5"/>
    <text x="1690" y="1272" font-family="Trebuchet MS, sans-serif" font-size="54" font-weight="bold"
          fill="#2E7D8C" text-anchor="middle">CAPITÁN MIGAS</text>
    <line x1="1575" y1="1320" x2="1805" y2="1320" stroke="#B8D5DC" stroke-width="4" stroke-dasharray="10 10"/>
  </g>

  <!-- ═══════════ FILA 2 ═══════════ -->

  <!-- EL KOBOLD -->
  <g>
    <path d="M440,1570 Q440,1540 470,1540 L990,1540 Q1020,1540 1020,1570 L1020,2420 L845,2420 L845,2550 L615,2550 L615,2420 L440,2420 Z"
          fill="#FFFFFF" stroke="#4A8C46" stroke-width="10" stroke-linejoin="round"/>
    <g clip-path="url(#im4)"><image href="../imagenes/tarjetas/kobold.jpg" x="470" y="1590" width="520" height="700" preserveAspectRatio="xMidYMid slice"/></g>
    <rect x="470" y="1590" width="520" height="700" rx="18" fill="none" stroke="#C9DEC5" stroke-width="5"/>
    <text x="730" y="2372" font-family="Trebuchet MS, sans-serif" font-size="62" font-weight="bold"
          fill="#3B7A38" text-anchor="middle">EL KOBOLD</text>
    <line x1="615" y1="2420" x2="845" y2="2420" stroke="#BCD6B8" stroke-width="4" stroke-dasharray="10 10"/>
  </g>

  <!-- EL DRAGÓN (nunca "Flamarada": el nombre es la pista del episodio 2) -->
  <g>
    <path d="M1080,1570 Q1080,1540 1110,1540 L1630,1540 Q1660,1540 1660,1570 L1660,2420 L1485,2420 L1485,2550 L1255,2550 L1255,2420 L1080,2420 Z"
          fill="#FFFFFF" stroke="#8A2820" stroke-width="10" stroke-linejoin="round"/>
    <g clip-path="url(#im5)"><image href="../imagenes/tarjetas/dragon.jpg" x="1110" y="1590" width="520" height="700" preserveAspectRatio="xMidYMid slice"/></g>
    <rect x="1110" y="1590" width="520" height="700" rx="18" fill="none" stroke="#E2C4C2" stroke-width="5"/>
    <text x="1370" y="2372" font-family="Trebuchet MS, sans-serif" font-size="62" font-weight="bold"
          fill="#8A2820" text-anchor="middle">EL DRAGÓN</text>
    <line x1="1255" y1="2420" x2="1485" y2="2420" stroke="#E2C4C2" stroke-width="4" stroke-dasharray="10 10"/>
  </g>

  <!-- ═══════════ PEANAS ═══════════ -->
  <text x="1050" y="2652" font-family="Trebuchet MS, sans-serif" font-size="48" font-weight="bold"
        fill="#7A6248" text-anchor="middle">LAS PEANAS · corta por la raya roja</text>

  <g>
    <rect x="120" y="2690" width="340" height="200" rx="22" fill="#FDF4D4" stroke="#8A6A3C" stroke-width="5" stroke-dasharray="18 14"/>
    <line x1="165" y1="2790" x2="415" y2="2790" stroke="#C1272D" stroke-width="11" stroke-linecap="round"/>

    <rect x="500" y="2690" width="340" height="200" rx="22" fill="#FDF4D4" stroke="#8A6A3C" stroke-width="5" stroke-dasharray="18 14"/>
    <line x1="545" y1="2790" x2="795" y2="2790" stroke="#C1272D" stroke-width="11" stroke-linecap="round"/>

    <rect x="880" y="2690" width="340" height="200" rx="22" fill="#FDF4D4" stroke="#8A6A3C" stroke-width="5" stroke-dasharray="18 14"/>
    <line x1="925" y1="2790" x2="1175" y2="2790" stroke="#C1272D" stroke-width="11" stroke-linecap="round"/>

    <rect x="1260" y="2690" width="340" height="200" rx="22" fill="#FDF4D4" stroke="#8A6A3C" stroke-width="5" stroke-dasharray="18 14"/>
    <line x1="1305" y1="2790" x2="1555" y2="2790" stroke="#C1272D" stroke-width="11" stroke-linecap="round"/>

    <rect x="1640" y="2690" width="340" height="200" rx="22" fill="#FDF4D4" stroke="#8A6A3C" stroke-width="5" stroke-dasharray="18 14"/>
    <line x1="1685" y1="2790" x2="1935" y2="2790" stroke="#C1272D" stroke-width="11" stroke-linecap="round"/>
  </g>

</svg>
</body>
</html>
