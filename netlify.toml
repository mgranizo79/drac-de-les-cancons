[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# React Router es client-side: sin esto, recargar /mesa o /dm-x7k2m9 da 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Nada de este sitio debe acabar en un buscador.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
